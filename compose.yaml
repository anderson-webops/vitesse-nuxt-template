services:
  api:
    build:
      context: .
      target: api
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3006
      TRUST_PROXY_HOPS: 1
    expose:
      - "3006"
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
